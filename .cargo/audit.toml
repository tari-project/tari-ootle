# Kept in step with the `[advisories]` section of `deny.toml` so `.github/workflows/audit.yml`
# (`rustsec/audit-check`, which invokes `cargo audit` rather than `cargo deny`) honours the same
# documented exceptions. See `deny.toml` for the full per-binary reachability and upgrade-blocker
# rationale for each entry.

[advisories]
ignore = [
    # rsa Marvin timing sidechannel; absent from every shipped binary (`pgp` only in L1 test binaries).
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5.5 via `webrtc -> dtls -> p256/p384` (ephemeral ECDH only; blocked on `dtls` moving to `p256` 0.14).
    "RUSTSEC-2026-0387",
    # bundled SQLite WAL page-size bug; blocked on `diesel` releasing with `libsqlite3-sys` 0.39 allowed.
    "RUSTSEC-2026-0459",
    # humantime 2.3.0 unmaintained; transitive only (log4rs, env_logger, console-subscriber, cucumber, humantime-serde).
    "RUSTSEC-2026-0542",
    # unsafe-libyaml 0.2.11 unmaintained; transitive only (serde_yaml -> libwild -> wasmer-compiler -> wasmer 7.5.0).
    "RUSTSEC-2024-0449",
    # proc-macro-error2 2.0.1 unmaintained; transitive only (wasmer-derive -> wasmer 7.5.0, getset 0.1.6).
    "RUSTSEC-2026-0173",
    # pin-utils 0.1.0 unmaintained (archived upstream); transitive only (hyper 1.8.1, nix 0.26.4).
    "RUSTSEC-2026-0441",
]
