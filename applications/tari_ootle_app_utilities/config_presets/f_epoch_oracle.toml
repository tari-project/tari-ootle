########################################################################################################################
#                                                                                                                      #
#                                    Epoch Oracle Configuration Options                                                #
#                                                                                                                      #
########################################################################################################################

[epoch_oracle]
# MainNet nodes ignore `oracle`, `base_layer.start_height` and the `configured` section: MainNet always runs the Hybrid
# oracle with the scan start height and validator set fixed in the release.
#
# The oracle type can be either "BaseLayer", "Configured" or "Hybrid".
# "BaseLayer" oracle uses the Tari base node to determine the epoch and scans layer 2 UTXOs.
# "Configured" oracle uses a pre-defined configuration file to determine the epoch and validators.
# "Hybrid" oracle combines both the base layer and configured oracles. i.e. base layer determines the epoch, burnt UTXOs
# and the configured oracle provides the validators.

#oracle = "BaseLayer"

[epoch_oracle.base_layer]
# The Tari base node's GRPC URL. If none is specified, http://localhost:{port} will be used where {port} is the network-specific default.
#base_node_grpc_url = "http://localhost:18142"

# Interval between base layer scans in seconds. Default is 30 seconds.
#scanning_interval = 30

[epoch_oracle.configured]

# The configured epoch oracle config can be supplied in one of two ways:
#
# 1. As a path to a separate toml, json or json5 file (`config_file`), or
# 2. Inline as a JSON (json5-compatible) string (`config_json`).
#
# Set exactly one of `config_file` or `config_json` (setting both is an error). The config has the following shape:
#{
#  "epoch_time": 120,
#  "initial_epoch": 3,
#  "base_time": "2026-02-23T13:08:42+0000",
#  "validators": [{
#    "public_key": "04efea68c9bff8f9c25fe89310abf91955e33344f4b77bb0d31ea80a80128e67",
#    "claim_key": "04efea68c9bff8f9c25fe89310abf91955e33344f4b77bb0d31ea80a80128e67",
#    "shard_group": {"start": 1,"end_inclusive": 256},
#    "registration_epoch": 5,
#    // Optional, defaults to 1. Vote power: a small integer count of stake units. Must be at least 1,
#    // all validators' power together must not exceed 65536, and it is fixed once the validator has activated.
#    "power": 1,
#    // Optional. Rotates the validator's claim key from the start of each `effective_epoch`.
#    "claim_key_changes": [
#      {"effective_epoch": 100, "claim_key": "9a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9"}
#    ]
#  }]
#}
#
# Every validator node must run the same config: nodes derive each other's claim keys from it, so a node holding a
# stale claim key for a proposer computes a different state merkle root and refuses to vote for its blocks. A
# rotation therefore names the epoch it applies from rather than taking effect on restart, and each node only has to
# be given the new config at any point before that epoch.
#
# To rotate a claim key, add an entry to `claim_key_changes`; do not edit `claim_key`, which is fixed once the
# validator has activated (it is an input to shard key derivation). Fees already earned under the previous key stay
# in the fee pool derived from it and remain claimable with that key — sweep them with the wallet's
# `claim_validator_fees` using the previous key's index.
#
# Load it from a file:
#config_file = "epoch_oracle_config.toml"
#
# Or embed it directly (note the TOML multi-line """ string):
#config_json = """
#{
#    "epoch_time": 120,
#    "initial_epoch": 3,
#    "base_time": "2026-02-23T13:08:42+0000",
#    "validators": []
#}
#"""

[esmeralda.epoch_oracle]
oracle = "Hybrid"

[esmeralda.epoch_oracle.base_layer]
base_node_grpc_url = "https://grpc.esmeralda.tari.com"
# This is the "birthday" height if the current esme testnet for ootle
start_height = 669506

