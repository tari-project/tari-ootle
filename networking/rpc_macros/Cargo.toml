[package]
name = "tari_rpc_macros"
publish = false
description = "RPC service proc macro"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full", "fold", "extra-traits"] }

[dev-dependencies]
tari_rpc_framework = { workspace = true }

prost = { workspace = true, features = ["std", "derive"] }
